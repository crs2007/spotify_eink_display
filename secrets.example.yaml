# Copy to secrets.yaml (git-ignored) and fill in.
# Flat "key: value" only. Quote values that contain '#' or ':'.

# Pico 2 W (2.4 GHz networks only)
wifi_ssid: "your-wifi"
wifi_password: "your-password"

# Shared by the Pico and the add-on (add-on option `device_token`).
# Generate one with:  python -c "import secrets; print(secrets.token_urlsafe(24))"
device_token: "change-me-to-a-long-random-string"

# Add-on, local development only. On Home Assistant, set these in the add-on options.
lastfm_api_key: ""
ha_token: ""
